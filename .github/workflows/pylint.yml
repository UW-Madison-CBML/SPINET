name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: jenslundsgaard/sheaf_training:v3.0
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
    - name: Analysing the code with pylint
      run: |
        pylint $(git ls-files '*.py')
