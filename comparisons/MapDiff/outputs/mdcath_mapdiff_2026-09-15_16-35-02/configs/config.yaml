dataset:
  name: MDCATH
  train_dir: ./surffold_data/mdcath_process/train/
  val_dir: ./surffold_data/mdcath_process/validation/
  test_dir: ./surffold_data/mdcath_process/validation/
  index_csv: null
  val_fold: 0
  max_length: 1200
  marginal_train_dir: ./surffold_data/train_marginal_x_mdcath.pt
model:
  name: egnn
  input_feat_dim: 31
  edge_attr_dim: 93
  hidden_dim: 128
  drop_out: 0.1
  depth: 6
  update_edge: true
  update_coors: true
  update_global: true
  norm_coors: true
  embedding: true
  embedding_dim: 128
  norm_feat: true
  embed_ss: -3
  ipa_drop_out: 0.2
  ipa_pe_max_len: ${dataset.max_length}
diffusion:
  objective: pred_x0
  timesteps: 500
  ddim_steps: 100
  noise_type: marginal
  sample_method: ddim
  ensemble_num: 50
mask_prior:
  min_mask_ratio: 0.4
  dev_mask_ratio: 0.2
mask_train:
  lr: 0.0005
  weight_decay: 0
  scheduler: true
  train_epochs: 8
  batch_size: 8
  clip_grad_norm: 1.0
  save_epochs: 50
  candi_rate: 0.6
  mask_rate: 0.8
  replace_rate: 0.1
  keep_rate: 0.1
train:
  lr: 0.0005
  weight_decay: 0
  scheduler: true
  train_epochs: 8
  batch_size: 8
  save_and_sample_every: 2
wandb:
  use: true
  entity: jenslundsgaard7-uw-madison
  project: SheafProtein
  run_name: MapDiff_atlas
  key_file: ./wandb_api.txt
experiment:
  name: mdcath_mapdiff
prior_model:
  path: null
