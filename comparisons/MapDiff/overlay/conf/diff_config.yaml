defaults:
  - dataset: cath
  - model: egnn
  - diffusion: discrete_default
  - train: train_diff
  - comet: basic
  - wandb: basic
  - mask_prior: default

hydra:
  run:
    dir: ./outputs/${experiment.name}_${now:%Y-%m-%d}_${now:%H-%M-%S}
  output_subdir: configs

experiment:
  name: MapDiff

prior_model:
  path: pretrained_ipa_path

train:
  save_and_sample_every: 2
  train_epochs: 8
  batch_size: 1
