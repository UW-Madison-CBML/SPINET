name: MDCATH

# Graphs featurized from each CATH domain's *relaxed* (deposited) PDB entry, cropped to the
# residues its mdCATH trajectory covers -- see ../../data/generate_graph_relaxed.py. The
# `domain` ids (e.g. 12asA00) name the pdb entry and chain the domain comes from.
train_dir: ./surffold_data/mdcath_process/train/
# mdcath_320_0_topology_split.csv's three `split` values map one-to-one onto the three splits:
# `train` trains, `validation` is scored every epoch and drives model selection, `test` is
# held out and scored once -- matching scripts/train_residue_classifier.py.
val_dir: ./surffold_data/mdcath_process/validation/
test_dir: ./surffold_data/mdcath_process/test/

# Which rows land in which split is decided by lib/dataset_splits.py, not by whatever files
# happen to sit in the directories above (train.py's `split_file_ids`). Leave index_csv null
# to use the standard file name train.sh stages into the job's scratch dir. `val_fold` and
# `test_fold` are ATLAS-only (mdCATH's split column is categorical) and are carried here just
# for symmetry.
index_csv: null
val_fold: 0
test_fold: 4

# Proteins longer than this (in residues) are dropped -- must match
# model.ipa_pe_max_len, which sizes the IPA node encoder's fixed
# positional-encoding table, AND lib/dataset_splits.MAX_LENGTH, which is what PiFold
# filters on. All three have to move together or the models score different proteins.
max_length: 1200

marginal_train_dir: ./surffold_data/train_marginal_x_mdcath.pt
