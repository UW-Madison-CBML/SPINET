name: MDCATH

# Graphs featurized from each CATH domain's *relaxed* (deposited) PDB entry, cropped to the
# residues its mdCATH trajectory covers -- see ../../data/generate_graph_relaxed.py. The
# `domain` ids (e.g. 12asA00) name the pdb entry and chain the domain comes from.
train_dir: ./surffold_data/mdcath_process/train/
# mdcath_320_0_topology_split.csv's train+test rows train (both are topology-split slices of
# the training pool); evaluation is on the `validation` rows ONLY, matching
# scripts/train_residue_classifier.py. mdCATH has no further held-out set, so validation
# doubles as the test split.
val_dir: ./surffold_data/mdcath_process/validation/
test_dir: ./surffold_data/mdcath_process/validation/

# Proteins longer than this (in residues) are dropped -- must match
# model.ipa_pe_max_len, which sizes the IPA node encoder's fixed
# positional-encoding table.
max_length: 1200

marginal_train_dir: ./surffold_data/train_marginal_x_mdcath.pt
