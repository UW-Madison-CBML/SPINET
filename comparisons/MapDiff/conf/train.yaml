defaults:
  - dataset: atlas
  - model: egnn
  - diffusion: discrete_default
  - mask_prior: default
  - mask_train: default
  - train: train_diff
  - wandb: basic

hydra:
  run:
    dir: ./outputs/${experiment.name}_${now:%Y-%m-%d}_${now:%H-%M-%S}
  output_subdir: configs

experiment:
  name: MapDiff_atlas

# Device placement. ESMFold (self-consistency RMSD, lib/scrmsd.py) is ~2.8B
# parameters in fp32 -- ~11GB of weights that stay resident for the entire run
# even though they are only used in the val/test passes. Parking it on a second
# GPU is what lets the EGNN/IPA training keep a full-size train.batch_size; with
# both on one card the diffusion stage OOMs.
#
# train.sub therefore requests 2 GPUs. On a single-GPU machine, either override
# compute.esmfold_device=cuda:0 (and drop train.batch_size / mask_train.batch_size
# to 4), or just let train.py fall back -- it prints a warning and collapses both
# onto cuda:0 when the requested index does not exist.
compute:
  device: cuda:0
  esmfold_device: cuda:1

# Optional: path to an already-trained mask-prior IPA checkpoint (as saved by
# this same script's stage-1 pretraining, under <output_dir>/model/). When
# set, stage 1 is skipped and this checkpoint is loaded straight into the
# diffusion model's frozen prior instead of training one from scratch.
prior_model:
  path: null
