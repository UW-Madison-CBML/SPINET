dataset:
  name: ATLAS
  train_dir: ./surffold_data/atlas_process/train/
  val_dir: ./data/atlas/atlas_process/validation/
  test_dir: ./data/atlas/atlas_process/test/
  max_length: 1200
  marginal_train_dir: data/source/train_marginal_x_atlas.pt
model:
  name: egnn
  input_feat_dim: 31
  edge_attr_dim: 93
  hidden_dim: 128
  drop_out: 0.1
  depth: 6
  update_edge: true
  update_coors: true
  update_global: true
  norm_coors: true
  embedding: true
  embedding_dim: 128
  norm_feat: true
  embed_ss: -3
  ipa_drop_out: 0.2
  ipa_pe_max_len: ${dataset.max_length}
diffusion:
  objective: pred_x0
  timesteps: 500
  ddim_steps: 100
  noise_type: marginal
  sample_method: ddim
  ensemble_num: 50
train:
  lr: 0.0005
  weight_decay: 0
  scheduler: true
  train_epochs: 200
  batch_size: 1
  clip_grad_norm: 1.0
  save_and_sample_every: 1
  candi_rate: 0.6
  mask_rate: 0.8
  replace_rate: 0.1
  keep_rate: 0.1
comet:
  project_name: mask_pretrain
  workspace: your_workspace
  use: false
  comet_tag: null
experiment:
  name: atlas_mask_ipa
