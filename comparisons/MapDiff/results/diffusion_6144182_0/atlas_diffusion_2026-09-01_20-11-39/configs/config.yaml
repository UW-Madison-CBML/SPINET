dataset:
  name: ATLAS
  train_dir: ./surffold_data/atlas_process/train/
  val_dir: ./surffold_data/atlas_process/validation/
  test_dir: ./surffold_data/atlas_process/test/
  max_length: 1200
  marginal_train_dir: ./surffold_data/train_marginal_x_atlas.pt
model:
  name: egnn
  input_feat_dim: 31
  edge_attr_dim: 93
  hidden_dim: 128
  drop_out: 0.1
  depth: 6
  update_edge: true
  update_coors: true
  update_global: true
  norm_coors: true
  embedding: true
  embedding_dim: 128
  norm_feat: true
  embed_ss: -3
  ipa_drop_out: 0.2
  ipa_pe_max_len: ${dataset.max_length}
diffusion:
  objective: pred_x0
  timesteps: 500
  ddim_steps: 100
  noise_type: marginal
  sample_method: ddim
  ensemble_num: 50
train:
  lr: 0.0005
  weight_decay: 0
  scheduler: true
  train_epochs: 8
  batch_size: 1
  save_and_sample_every: 2
comet:
  project_name: diff_pif
  workspace: your_workspace
  use: false
  comet_tag: null
mask_prior:
  min_mask_ratio: 0.4
  dev_mask_ratio: 0.2
experiment:
  name: atlas_diffusion
prior_model:
  path: ./atlas_mask_ipa_last_200_epochs_2026-09-01_11-14-03.pt
